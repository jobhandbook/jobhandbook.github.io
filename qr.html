<title>QR — 질문은 여기 | 취업핸드북 서재민</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<main class="qr-page">
  <div>
    <span class="eyebrow" style="color:var(--accent-2)">취업 · 이직, 무엇이든 물어보세요</span>
    <div class="qr-box" style="margin-top:18px"><img src="img/qr-lounge.svg" alt="라운지로 가는 QR 코드" id="qr-img" /></div>

    <div class="url">jobhandbook.github.io</div>
    <div class="tools">
      <a class="btn btn-primary btn-sm" href="img/qr-lounge.png" download="jobhandbook-qr.png">인쇄용 PNG 내려받기</a>
      <a class="btn btn-ghost btn-sm" href="img/qr-lounge.svg" download="jobhandbook-qr.svg">SVG 내려받기</a>
      <button class="btn btn-ghost btn-sm" type="button" onclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()">전체 화면 (강의용)</button>
    </div>
    <p class="small muted back" style="margin-top:22px"><a href="index.html" style="color:var(--ink-3)">← 홈페이지</a> · 이 페이지를 특강 마지막 슬라이드 대신 띄우면 됩니다.</p>
  </div>
